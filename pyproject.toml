[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "line-scryfall-bot"
version = "0.3.0"
description = "Quiet LINE group MTG card lookup bot with platform-independent core"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-dotenv>=1,<2", "httpx>=0.27,<1", "line-bot-sdk>=3.14,<4", "Pillow>=10.4,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["mtg_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
